<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Three-layer framework: Physical, Socio-Spatial, Embodied — animated agents at decreasing fidelity">
  <style>
    text {
      font-family: 'Anonymous Pro', 'Courier New', 'Courier', monospace;
      fill: #1a1a1a;
    }
    .num   { font-size: 36px; font-weight: 700; letter-spacing: 0.04em; }
    .layer { font-size: 22px; font-weight: 700; letter-spacing: 0.18em; }
    .meta  { font-size: 12px; fill: #666; font-style: italic; letter-spacing: 0.14em; }
  </style>

  <!-- top meta -->
  <text class="meta" x="40" y="44">LAYER-SPECIFIC LLM PARTICIPATION</text>
  <line x1="40" y1="58" x2="600" y2="58" stroke="#000" stroke-width="0.5" opacity="0.4" />

  <!-- Layer 3 — EMBODIED (top) : open question -->
  <text class="num"   x="42" y="128">3</text>
  <text class="layer" x="92" y="123">EMBODIED</text>
  <line x1="320" y1="128" x2="588" y2="128"
        stroke="#999" stroke-width="1" stroke-dasharray="1 8" />
  <circle cx="460" cy="128" r="3" fill="#999">
    <animate attributeName="opacity" values="0.15;0.55;0.15" dur="3.2s" repeatCount="indefinite" />
    <animate attributeName="r"       values="2.5;4.5;2.5"     dur="3.2s" repeatCount="indefinite" />
  </circle>
  <text x="598" y="134" font-size="18" fill="#bbb"
        font-family="'Anonymous Pro', 'Courier New', monospace">?</text>

  <!-- Layer 2 — SOCIO-SPATIAL (middle) : bounded informant -->
  <text class="num"   x="42" y="218">2</text>
  <text class="layer" x="92" y="213">SOCIO-SPATIAL</text>
  <line x1="320" y1="218" x2="588" y2="218"
        stroke="#444" stroke-width="1" stroke-dasharray="6 4" />
  <circle r="4" fill="#444" cy="218">
    <animate attributeName="cx"      values="320;588;320"    dur="7s"   repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.5;0.9;0.5"     dur="7s"   repeatCount="indefinite" />
  </circle>

  <!-- Layer 1 — PHYSICAL (bottom) : autonomous proxy -->
  <text class="num"   x="42" y="308">1</text>
  <text class="layer" x="92" y="303">PHYSICAL</text>
  <line x1="320" y1="308" x2="588" y2="308" stroke="#000" stroke-width="1.3" />
  <circle r="5" fill="#000" cy="308">
    <animate attributeName="cx" values="320;588;320" dur="5s" repeatCount="indefinite" />
  </circle>

  <!-- bottom attribution -->
  <text class="meta" x="40" y="345">CHI '26 WORKSHOP ON LLM SIMULACRA · LEFEBVRE TRIALECTIC</text>
</svg>
