<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360"
     role="img" aria-label="Lefebvre trialectic — Physical / Socio-spatial / Embodied — three vertices of spatial usability evaluation">
  <defs>
    <style>
      text { font-family: 'Anonymous Pro', 'Courier New', monospace; fill: #1a1a1a; }
      .vertex-label { font-size: 11px; font-weight: 700; letter-spacing: 0.22em; }
      .vertex-sub   { font-size: 9.5px; fill: #888; font-style: italic; letter-spacing: 0.08em; }
      .num          { font-size: 16px; font-weight: 400; fill: #999; letter-spacing: 0; }
      .meta         { font-size: 10.5px; fill: #777; font-style: italic; letter-spacing: 0.16em; }
    </style>
  </defs>

  <!-- top meta + hairline rule -->
  <text class="meta" x="40" y="40">LAYER-SPECIFIC LLM PARTICIPATION</text>
  <line x1="40" y1="54" x2="600" y2="54" stroke="#000" stroke-width="0.5" opacity="0.35" />

  <!-- Triangle vertices: top (3 EMBODIED), bottom-left (1 PHYSICAL), bottom-right (2 SOCIO-SPATIAL) -->
  <!-- Edges -->
  <line x1="320" y1="115" x2="160" y2="285" stroke="#1a1a1a" stroke-width="1" />
  <line x1="320" y1="115" x2="480" y2="285" stroke="#1a1a1a" stroke-width="1" />
  <line x1="160" y1="285" x2="480" y2="285" stroke="#1a1a1a" stroke-width="1" />

  <!-- Subtle medians from each vertex to the centroid (320, 228) — emphasizes the three-pole structure -->
  <line x1="320" y1="115" x2="320" y2="228" stroke="#bbb" stroke-width="0.5" stroke-dasharray="2 4" />
  <line x1="160" y1="285" x2="320" y2="228" stroke="#bbb" stroke-width="0.5" stroke-dasharray="2 4" />
  <line x1="480" y1="285" x2="320" y2="228" stroke="#bbb" stroke-width="0.5" stroke-dasharray="2 4" />

  <!-- Center mark — a tiny standing body at the centroid: the body in space -->
  <g transform="translate(320, 228)">
    <circle cx="0" cy="-7" r="2.5" fill="#1a1a1a" />
    <line x1="0" y1="-4" x2="0" y2="6" stroke="#1a1a1a" stroke-width="2" />
    <line x1="-5" y1="0" x2="5" y2="0" stroke="#1a1a1a" stroke-width="1.4" />
  </g>

  <!-- Vertex 3 — EMBODIED (top) : open / question. Hollow circle, lightest weight -->
  <circle cx="320" cy="115" r="6" fill="#fbf6f6" stroke="#999" stroke-width="1.4" />
  <text class="num" x="320" y="76" text-anchor="middle" fill="#999">3</text>
  <text class="vertex-label" x="320" y="93" text-anchor="middle" fill="#1a1a1a">EMBODIED</text>
  <text class="vertex-sub"   x="320" y="106" text-anchor="middle">lived space</text>

  <!-- Vertex 1 — PHYSICAL (bottom-left) : autonomous. Solid filled, heaviest weight -->
  <circle cx="160" cy="285" r="7" fill="#1a1a1a" />
  <text class="num"          x="160" y="318" text-anchor="middle">1</text>
  <text class="vertex-label" x="160" y="335" text-anchor="middle">PHYSICAL</text>
  <text class="vertex-sub"   x="160" y="348" text-anchor="middle">perceived space</text>

  <!-- Vertex 2 — SOCIO-SPATIAL (bottom-right) : bounded informant. Medium weight -->
  <circle cx="480" cy="285" r="5.5" fill="#444" />
  <text class="num"          x="480" y="318" text-anchor="middle">2</text>
  <text class="vertex-label" x="480" y="335" text-anchor="middle">SOCIO-SPATIAL</text>
  <text class="vertex-sub"   x="480" y="348" text-anchor="middle">conceived space</text>
</svg>
